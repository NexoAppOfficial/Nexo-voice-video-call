<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NexoApp Private Call</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #root { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script src="https://unpkg.com/@zegocloud/zego-uikit-prebuilt/zego-uikit-prebuilt.js"></script>
    <script>
        // ========== Credentials ==========
        const appID = 233961104;
        const serverSecret = "8475a53e8eded3d1daaac9fe7baa7222";
        // ================================

        // Auto generate roomID (user doesn't need to enter anything)
        const roomID = "private_" + Math.floor(Math.random() * 1000000);
        const userID = Math.floor(Math.random() * 10000) + "";
        const userName = "User_" + userID;

        // Check if it's voice or video from URL
        const urlParams = new URLSearchParams(window.location.search);
        const media = urlParams.get('media') || "voice"; // default voice

        const kitToken = ZegoUIKitPrebuilt.generateKitTokenForTest(
            appID,
            serverSecret,
            roomID,
            userID,
            userName
        );

        const zp = ZegoUIKitPrebuilt.create(kitToken);
        zp.joinRoom({
            container: document.querySelector("#root"),
            sharedLinks: [{
                name: 'Invite to this Call',
                url: window.location.protocol + '//' + window.location.host + window.location.pathname + 
                     '?roomID=' + roomID + '&media=' + media,
            }],
            scenario: {
                mode: ZegoUIKitPrebuilt.OneONoneCall, // Strict 1-on-1
            },
            turnOnCameraWhenJoining: media === "video",
            turnOnMicrophoneWhenJoining: true,
            showMyCameraToggleButton: true,
            showMyMicrophoneToggleButton: true,
            showAudioVideoSettingsButton: true,
            showTextChat: true,
        });
    </script>
</body>
</html>
