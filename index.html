
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>NexoApp Private Call</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body, #root {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #root {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script src="https://unpkg.com/@zegocloud/zego-uikit-prebuilt/zego-uikit-prebuilt.js"></script>

    <script>
        const params = new URLSearchParams(
            window.location.search
        );

        const roomID = params.get("roomID");
        const userID = params.get("userID");
        const userName = params.get("userName") || "NexoApp User";
        const media = params.get("media") || "voice";

        // Replace these with your project's credentials.
        const appID = YOUR_APP_ID;
        const serverSecret = "DO_NOT_PUT_PRODUCTION_SECRET_HERE";

        if (!roomID || !userID) {
            document.getElementById("root").textContent =
                "Missing room ID or user ID.";
            throw new Error("Missing required call parameters.");
        }

        if (!["voice", "video"].includes(media)) {
            throw new Error("Invalid call media type.");
        }

        const kitToken =
            ZegoUIKitPrebuilt.generateKitTokenForTest(
                appID,
                serverSecret,
                roomID,
                userID,
                userName
            );

        const zp = ZegoUIKitPrebuilt.create(kitToken);

        zp.joinRoom({
            container: document.getElementById("root"),

            scenario: {
                mode: ZegoUIKitPrebuilt.OneONoneCall
            },

            turnOnCameraWhenJoining: media === "video",
            turnOnMicrophoneWhenJoining: true,

            showMyCameraToggleButton: true,
            showMyMicrophoneToggleButton: true,
            showAudioVideoSettingsButton: true,
            showScreenSharingButton: false,
            showTextChat: false,
            showUserList: false,

            maxUsers: 2
        });
    </script>
</body>
</html>
